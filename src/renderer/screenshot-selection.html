<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23202328'/%3E%3Cpath d='M8 5H5v5M24 5h3v5M8 27H5v-5M24 27h3v-5' fill='none' stroke='%23ffffff' stroke-width='2'/%3E%3C/svg%3E" />
    <title>选择截图区域</title>
  </head>
  <body>
    <main id="selection-app" class="is-loading">
      <img id="screen-image" alt="" draggable="false" />
      <svg id="screen-shade" aria-hidden="true">
        <defs>
          <mask id="selection-mask">
            <rect width="100%" height="100%" fill="white" />
            <rect id="selection-hole" width="0" height="0" fill="black" />
          </mask>
        </defs>
        <rect width="100%" height="100%" fill="rgba(8, 12, 18, 0.48)" mask="url(#selection-mask)" />
      </svg>

      <div id="selection-box" hidden>
        <span class="handle nw" data-handle="nw"></span>
        <span class="handle n" data-handle="n"></span>
        <span class="handle ne" data-handle="ne"></span>
        <span class="handle e" data-handle="e"></span>
        <span class="handle se" data-handle="se"></span>
        <span class="handle s" data-handle="s"></span>
        <span class="handle sw" data-handle="sw"></span>
        <span class="handle w" data-handle="w"></span>
        <span id="selection-size"></span>
      </div>

      <div id="selection-help">
        <strong>拖动选择截图区域</strong>
        <span>松开鼠标后可移动或调整大小 · Esc 取消</span>
      </div>

      <div id="selection-toolbar" hidden>
        <button type="button" id="selection-reset">重新选择</button>
        <span class="toolbar-separator"></span>
        <button type="button" id="selection-cancel">取消</button>
        <button type="button" id="selection-confirm" class="primary">完成截图</button>
      </div>
    </main>
    <script type="module" src="./screenshot-selection.ts"></script>
  </body>
</html>
